[build]
  command = "npm run build"
  publish = "app-dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure ES modules are served with the correct MIME type
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript"
